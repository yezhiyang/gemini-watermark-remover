services:
  gemini-watermark-remover:
    build: .
    container_name: gemini-watermark-remover
    ports:
      - "2234:2234"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2234/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
